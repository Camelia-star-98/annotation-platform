<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试 Supabase 连接</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #333; }
    .result {
      margin: 20px 0;
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #ddd;
    }
    .success { background: #d4edda; border-color: #c3e6cb; }
    .error { background: #f8d7da; border-color: #f5c6cb; }
    .info { background: #d1ecf1; border-color: #bee5eb; }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>🔌 测试 Supabase 连接</h1>
  
  <button onclick="testConnection()">🔄 测试连接</button>
  <button onclick="testSimpleQuery()">📊 测试简单查询</button>
  <button onclick="testAnnotationCompletions()">📋 查询 annotation_completions</button>
  
  <div id="result"></div>

  <script>
    const SUPABASE_URL = 'https://pwufacekikjqcgjptnxh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3dWZhY2VraWtqcWNnanB0bnhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzIxNjkyODAsImV4cCI6MjA0Nzc0NTI4MH0.TRo-RdJEU-0fZ1sImQ6_T1wXFFb1nJTnBPabdXJVHKE';
    
    console.log('初始化 Supabase 客户端...');
    console.log('URL:', SUPABASE_URL);
    console.log('Key 长度:', SUPABASE_ANON_KEY.length);
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    function showResult(title, content, type = 'info') {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <div class="result ${type}">
          <h2>${title}</h2>
          ${content}
        </div>
      `;
    }

    async function testConnection() {
      showResult('🔄 测试中...', '<p>正在测试 Supabase 连接...</p>', 'info');
      
      try {
        console.log('开始测试连接...');
        
        // 测试基本的 REST API 连接
        const response = await fetch(`${SUPABASE_URL}/rest/v1/`, {
          method: 'HEAD',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        
        console.log('Response status:', response.status);
        console.log('Response headers:', Object.fromEntries(response.headers.entries()));
        
        if (response.ok) {
          showResult(
            '✅ 连接成功！',
            `<p>成功连接到 Supabase 服务器</p>
             <p>状态码: ${response.status}</p>`,
            'success'
          );
        } else {
          showResult(
            '❌ 连接失败',
            `<p>HTTP 状态码: ${response.status}</p>
             <p>状态文本: ${response.statusText}</p>`,
            'error'
          );
        }
      } catch (error) {
        console.error('连接测试失败:', error);
        showResult(
          '❌ 连接失败',
          `<p>错误信息: ${error.message}</p>
           <p>错误类型: ${error.name}</p>
           <pre>${error.stack}</pre>`,
          'error'
        );
      }
    }

    async function testSimpleQuery() {
      showResult('🔄 测试中...', '<p>正在执行简单查询...</p>', 'info');
      
      try {
        console.log('开始查询 videos 表...');
        
        const { data, error, count } = await supabase
          .from('videos')
          .select('id, name', { count: 'exact', head: false })
          .limit(1);
        
        console.log('查询结果:', { data, error, count });
        
        if (error) {
          showResult(
            '❌ 查询失败',
            `<p>错误信息: ${error.message}</p>
             <p>错误详情:</p>
             <pre>${JSON.stringify(error, null, 2)}</pre>`,
            'error'
          );
        } else {
          showResult(
            '✅ 查询成功！',
            `<p>成功查询到数据</p>
             <p>总记录数: ${count || '未知'}</p>
             <p>返回数据:</p>
             <pre>${JSON.stringify(data, null, 2)}</pre>`,
            'success'
          );
        }
      } catch (error) {
        console.error('查询失败:', error);
        showResult(
          '❌ 查询异常',
          `<p>错误信息: ${error.message}</p>
           <p>错误类型: ${error.name}</p>
           <pre>${error.stack}</pre>`,
          'error'
        );
      }
    }

    async function testAnnotationCompletions() {
      showResult('🔄 测试中...', '<p>正在查询 annotation_completions 表...</p>', 'info');
      
      try {
        console.log('开始查询 annotation_completions 表...');
        
        const { data, error, count } = await supabase
          .from('annotation_completions')
          .select('*', { count: 'exact', head: false });
        
        console.log('查询结果:', { data, error, count });
        
        if (error) {
          showResult(
            '❌ 查询失败',
            `<p>错误信息: ${error.message}</p>
             <p>错误代码: ${error.code || '无'}</p>
             <p>错误详情:</p>
             <pre>${JSON.stringify(error, null, 2)}</pre>`,
            'error'
          );
        } else {
          showResult(
            '✅ 查询成功！',
            `<p>成功查询 annotation_completions 表</p>
             <p>总记录数: ${count !== null ? count : data?.length || 0}</p>
             <p>返回数据（前5条）:</p>
             <pre>${JSON.stringify(data?.slice(0, 5), null, 2)}</pre>`,
            'success'
          );
        }
      } catch (error) {
        console.error('查询失败:', error);
        showResult(
          '❌ 查询异常',
          `<p>错误信息: ${error.message}</p>
           <p>错误类型: ${error.name}</p>
           <pre>${error.stack}</pre>`,
          'error'
        );
      }
    }

    // 页面加载时自动测试连接
    window.addEventListener('load', () => {
      console.log('页面已加载，准备测试连接...');
      setTimeout(testConnection, 500);
    });
  </script>
</body>
</html>
