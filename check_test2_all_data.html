<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检查"测试2"视频的所有数据</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1400px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-label {
            font-weight: bold;
            color: #495057;
        }
        .stat-value {
            color: #007bff;
            font-size: 1.2em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #667eea;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        tr:hover {
            background-color: #e9ecef;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #667eea;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .tag-pending {
            background: #fff3cd;
            color: #856404;
        }
        .tag-inspected {
            background: #d4edda;
            color: #155724;
        }
        .tag-reviewed {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 检查"测试2"视频的所有数据</h1>
        <div id="loading" class="loading">正在加载数据...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="stats" class="stats" style="display: none;"></div>
        <div id="result"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

        const SUPABASE_URL = 'https://ufzlzfsvcgzbmpvqzuoo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmemx6ZnN2Y2d6Ym1wdnF6dW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzI1MjAzNDYsImV4cCI6MjA0ODA5NjM0Nn0.uM-KkgPKe8NGVD0xsNp1QSs3kfL2vTJbqM3_DcAfPVE';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkTest2Data() {
            try {
                const loadingEl = document.getElementById('loading');
                const errorEl = document.getElementById('error');
                const statsEl = document.getElementById('stats');
                const resultEl = document.getElementById('result');

                // 1. 查找"测试2"视频
                console.log('🔍 Step 1: 查找"测试2"视频...');
                const { data: videos, error: videoError } = await supabase
                    .from('videos')
                    .select('*')
                    .eq('name', '测试2');

                if (videoError) {
                    throw new Error(`查询视频失败: ${videoError.message}`);
                }

                if (!videos || videos.length === 0) {
                    throw new Error('未找到"测试2"视频');
                }

                const video = videos[0];
                console.log('✅ 找到"测试2"视频:', video);

                // 2. 查询该视频的所有标注数据（不过滤任何条件）
                console.log('🔍 Step 2: 查询该视频的所有标注数据...');
                const { data: annotations, error: annError, count } = await supabase
                    .from('annotations')
                    .select('*', { count: 'exact' })
                    .eq('video_id', video.id)
                    .order('sentence_no', { ascending: true });

                if (annError) {
                    throw new Error(`查询标注数据失败: ${annError.message}`);
                }

                console.log('✅ 查询结果:', annotations);
                console.log('✅ 总数:', count);

                // 3. 统计数据
                const stats = {
                    total: count || 0,
                    withAnnotator: annotations.filter(a => a.annotator && a.annotator.trim() !== '').length,
                    withoutAnnotator: annotations.filter(a => !a.annotator || a.annotator.trim() === '').length,
                    withInspector: annotations.filter(a => a.inspector && a.inspector.trim() !== '').length,
                    withReviewer: annotations.filter(a => a.reviewer && a.reviewer.trim() !== '').length,
                    reviewStatusNull: annotations.filter(a => a.review_status === null).length,
                    reviewStatusPending: annotations.filter(a => a.review_status === 'pending').length,
                    reviewStatusPassed: annotations.filter(a => a.review_status === 'passed').length,
                    reviewStatusFailed: annotations.filter(a => a.review_status === 'failed').length,
                    annotatorNull: annotations.filter(a => a.annotator === null).length,
                    annotatorEmpty: annotations.filter(a => a.annotator === '').length,
                    annotatorUnknown: annotations.filter(a => a.annotator === 'unknown').length,
                };

                // 4. 显示统计信息
                loadingEl.style.display = 'none';
                statsEl.style.display = 'block';
                statsEl.innerHTML = `
                    <h2>📊 统计信息</h2>
                    <div class="stat-item">
                        <span class="stat-label">视频名称:</span>
                        <span class="stat-value">${video.name}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">视频ID:</span>
                        <span class="stat-value">${video.id}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">总数据条数:</span>
                        <span class="stat-value">${stats.total}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">有标注人的:</span>
                        <span class="stat-value">${stats.withAnnotator}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">无标注人的:</span>
                        <span class="stat-value" style="color: red;">${stats.withoutAnnotator}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">annotator = null:</span>
                        <span class="stat-value" style="color: orange;">${stats.annotatorNull}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">annotator = '':</span>
                        <span class="stat-value" style="color: orange;">${stats.annotatorEmpty}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">annotator = 'unknown':</span>
                        <span class="stat-value" style="color: orange;">${stats.annotatorUnknown}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">有质检员的:</span>
                        <span class="stat-value">${stats.withInspector}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">有复检员的:</span>
                        <span class="stat-value">${stats.withReviewer}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">review_status = null:</span>
                        <span class="stat-value">${stats.reviewStatusNull}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">review_status = 'pending':</span>
                        <span class="stat-value">${stats.reviewStatusPending}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">review_status = 'passed':</span>
                        <span class="stat-value">${stats.reviewStatusPassed}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">review_status = 'failed':</span>
                        <span class="stat-value">${stats.reviewStatusFailed}</span>
                    </div>
                `;

                // 5. 显示详细数据表格
                let tableHtml = `
                    <h2>📝 详细数据（前50条）</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>句号</th>
                                <th>标注人</th>
                                <th>质检员</th>
                                <th>复检员</th>
                                <th>review_status</th>
                                <th>is_qualified</th>
                                <th>人工标注文本</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                annotations.slice(0, 50).forEach(ann => {
                    const reviewStatusTag = ann.review_status 
                        ? `<span class="tag tag-${ann.review_status === 'pending' ? 'pending' : 'reviewed'}">${ann.review_status}</span>`
                        : '<span class="tag tag-pending">null</span>';
                    
                    tableHtml += `
                        <tr>
                            <td>${ann.sentence_no}</td>
                            <td>${ann.annotator || '-'}</td>
                            <td>${ann.inspector || '-'}</td>
                            <td>${ann.reviewer || '-'}</td>
                            <td>${reviewStatusTag}</td>
                            <td>${ann.is_qualified !== null ? (ann.is_qualified ? '✅' : '❌') : '-'}</td>
                            <td>${ann.human_annotated_text || '-'}</td>
                        </tr>
                    `;
                });

                tableHtml += `
                        </tbody>
                    </table>
                `;

                resultEl.innerHTML = tableHtml;

            } catch (error) {
                console.error('❌ 错误:', error);
                document.getElementById('loading').style.display = 'none';
                const errorEl = document.getElementById('error');
                errorEl.style.display = 'block';
                errorEl.textContent = `错误: ${error.message}`;
            }
        }

        // 执行检查
        checkTest2Data();
    </script>
</body>
</html>
