<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Supabase诊断工具</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 900px; margin: 0 auto; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Supabase 完整诊断</h1>
    
    <button onclick="runAllTests()">运行所有测试</button>
    <button onclick="fixDatabase()">修复数据库</button>
    <button onclick="testSave()">测试保存</button>
    
    <div id="results"></div>

    <script>
        const SUPABASE_URL = 'https://ybukjvugqulbonbqewow.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlidWtqdnVncXVsYm9uYnFld293Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxMTAyNTEsImV4cCI6MjA3ODY4NjI1MX0.QRJuHyU5C-22Vdx9gUR5fsCQZnF6bm5AzV4Gc-tPeRA';

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong><br>${message}`;
            document.getElementById('results').appendChild(div);
        }

        async function testConnection() {
            log('🔍 测试1: 检查基本连接...');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                log(`✅ 连接成功！状态: ${response.status}`, 'success');
                return true;
            } catch (err) {
                log(`❌ 连接失败: ${err.message}`, 'error');
                return false;
            }
        }

        async function checkTables() {
            log('🔍 测试2: 检查表是否存在...');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/annotations?limit=1`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (response.status === 404 || response.status === 406) {
                    const error = await response.json();
                    log(`❌ 表不存在或有问题:<br><pre>${JSON.stringify(error, null, 2)}</pre>`, 'error');
                    return false;
                }
                
                const data = await response.json();
                log(`✅ annotations表存在！当前有 ${data.length} 条数据`, 'success');
                return true;
            } catch (err) {
                log(`❌ 检查表失败: ${err.message}`, 'error');
                return false;
            }
        }

        async function testInsert() {
            log('🔍 测试3: 测试插入数据...');
            const testData = {
                id: 'test_' + Date.now(),
                video_id: 'test_video',
                sentence_no: 1,
                time_range: '00:00-00:05',
                original_text: '测试原文',
                ai_rewritten_text: '测试AI改写',
                human_annotated_text: '测试人工标注',
                status: true,
                annotator: '测试用户'
            };

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/annotations`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(testData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    log(`❌ 插入失败 (${response.status}):<br><pre>${JSON.stringify(error, null, 2)}</pre>`, 'error');
                    return false;
                }

                const result = await response.json();
                log(`✅ 插入成功！<br><pre>${JSON.stringify(result, null, 2)}</pre>`, 'success');
                
                // 清理测试数据
                await fetch(`${SUPABASE_URL}/rest/v1/annotations?id=eq.${testData.id}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                log('🧹 测试数据已清理', 'success');
                return true;
            } catch (err) {
                log(`❌ 插入异常: ${err.message}`, 'error');
                return false;
            }
        }

        async function runAllTests() {
            document.getElementById('results').innerHTML = '';
            log('开始完整诊断...', 'info');
            
            const connected = await testConnection();
            if (!connected) {
                log('⚠️ 请先检查网络连接', 'error');
                return;
            }

            const tablesExist = await checkTables();
            if (!tablesExist) {
                log('⚠️ 需要创建或修复数据库表，请点击"修复数据库"按钮', 'error');
                return;
            }

            await testInsert();
            log('🎉 所有测试完成！', 'success');
        }

        async function fixDatabase() {
            log('🔧 开始修复数据库...', 'info');
            log('⚠️ 请在Supabase控制台的SQL Editor中执行以下SQL:', 'info');
            
            const sql = `
DROP TABLE IF EXISTS annotations CASCADE;
DROP TABLE IF EXISTS videos CASCADE;
DROP TABLE IF EXISTS users CASCADE;

CREATE TABLE annotations (
  id TEXT PRIMARY KEY,
  video_id TEXT,
  sentence_no INTEGER,
  time_range TEXT,
  start_time INTEGER,
  end_time INTEGER,
  original_text TEXT,
  ai_rewritten_text TEXT,
  human_annotated_text TEXT,
  major_category TEXT,
  minor_category TEXT,
  remark TEXT,
  status BOOLEAN DEFAULT FALSE,
  annotator TEXT,
  is_qualified BOOLEAN,
  inspector TEXT,
  video_name TEXT,
  video_url TEXT,
  subject TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW(),
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE videos (
  id TEXT PRIMARY KEY,
  name TEXT,
  url TEXT,
  subject TEXT,
  duration INTEGER,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE users (
  id TEXT PRIMARY KEY,
  name TEXT,
  role TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

ALTER TABLE annotations DISABLE ROW LEVEL SECURITY;
ALTER TABLE videos DISABLE ROW LEVEL SECURITY;
ALTER TABLE users DISABLE ROW LEVEL SECURITY;

INSERT INTO annotations (id, video_id, sentence_no, original_text, status, annotator) 
VALUES ('demo1', 'video1', 1, '演示数据', true, '系统');

SELECT * FROM annotations;
            `.trim();
            
            log(`<pre>${sql}</pre>`, 'info');
            log('📋 SQL已显示，请复制到Supabase执行，然后点击"运行所有测试"验证', 'info');
        }

        async function testSave() {
            log('🔍 模拟真实保存操作...', 'info');
            
            const annotations = [
                {
                    id: 'real_test_' + Date.now(),
                    video_id: 'video_test',
                    sentence_no: 1,
                    time_range: '00:00-00:05',
                    start_time: 0,
                    end_time: 5,
                    original_text: '这是真实的原文',
                    ai_rewritten_text: '这是真实的AI改写',
                    human_annotated_text: '这是真实的人工标注',
                    major_category: '大模型改写问题',
                    minor_category: '多加字',
                    remark: '测试备注',
                    status: true,
                    annotator: '张三',
                    video_name: '测试视频',
                    video_url: 'http://test.mp4',
                    subject: '物理'
                }
            ];

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/annotations`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(annotations)
                });

                if (!response.ok) {
                    const error = await response.json();
                    log(`❌ 保存失败:<br><pre>${JSON.stringify(error, null, 2)}</pre>`, 'error');
                } else {
                    const result = await response.json();
                    log(`✅ 保存成功！<br><pre>${JSON.stringify(result, null, 2)}</pre>`, 'success');
                }
            } catch (err) {
                log(`❌ 保存异常: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
