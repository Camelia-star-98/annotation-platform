<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看标注员工作详情</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            color: #1a202c;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .annotator-input {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .annotator-input input {
            flex: 1;
            max-width: 300px;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .annotator-input input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .annotator-input button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .annotator-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card .label {
            font-size: 14px;
            color: #718096;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
        }

        .stat-card.primary .value {
            color: #667eea;
        }

        .stat-card.success .value {
            color: #48bb78;
        }

        .stat-card.warning .value {
            color: #ed8936;
        }

        .stat-card.danger .value {
            color: #f56565;
        }

        .content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .content h2 {
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody tr {
            transition: all 0.2s;
        }

        tbody tr:hover {
            background: #f7fafc;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-submitted {
            background: #bee3f8;
            color: #2c5282;
        }

        .status-completed {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-pending {
            background: #fed7d7;
            color: #742a2a;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #48bb78 0%, #38a169 100%);
            transition: width 0.3s;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>👤</span>
                标注员工作详情
            </h1>
            <div class="annotator-input">
                <input type="text" id="annotatorInput" placeholder="输入标注员姓名..." value="郭其其">
                <button onclick="loadAnnotatorData()">🔍 查询</button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid" style="display: none;">
            <div class="stat-card primary">
                <div class="label">总视频数</div>
                <div class="value" id="totalVideos">0</div>
            </div>
            <div class="stat-card success">
                <div class="label">总句子数</div>
                <div class="value" id="totalSentences">0</div>
            </div>
            <div class="stat-card warning">
                <div class="label">已标注句子</div>
                <div class="value" id="annotatedSentences">0</div>
            </div>
            <div class="stat-card danger">
                <div class="label">完整度</div>
                <div class="value" id="completionRate">0%</div>
            </div>
        </div>

        <div class="content">
            <h2>📋 标注任务列表</h2>
            <div id="loadingDiv" class="loading">
                <div class="spinner"></div>
                <p>正在加载数据...</p>
            </div>
            <div id="dataContainer" style="display: none;">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>视频名称</th>
                            <th>状态</th>
                            <th>总句子数</th>
                            <th>已标注</th>
                            <th>进度</th>
                            <th>完成度</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h3>没有找到数据</h3>
                <p>该标注员还没有标注任务，或者名字输入有误</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dcqwxvekgxgjujurpipg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjcXd4dmVrZ3hnanVqdXJwaXBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwODYzODAsImV4cCI6MjA3ODY2MjM4MH0.AW8O6XG3Zj75B1eqfpCNNLACfdKYhcQhYYWzVPuTPAw';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadAnnotatorData() {
            const annotatorName = document.getElementById('annotatorInput').value.trim();
            
            if (!annotatorName) {
                alert('请输入标注员姓名');
                return;
            }

            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('dataContainer').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('statsGrid').style.display = 'none';

            try {
                // 查询该标注员的所有任务 - 使用 RPC 函数避免 RLS 限制
                const { data: videos, error } = await supabase
                    .rpc('get_annotator_videos', { 
                        p_annotator: annotatorName 
                    });

                if (error) {
                    console.error('RPC 错误:', error);
                    throw error;
                }

                document.getElementById('loadingDiv').style.display = 'none';

                if (!videos || videos.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                // 计算统计数据
                let totalVideos = videos.length;
                let totalSentences = 0;
                let annotatedSentences = 0;

                videos.forEach(video => {
                    const total = video.total_sentences || 0;
                    const annotated = video.annotated_sentences || 0;
                    totalSentences += total;
                    annotatedSentences += annotated;
                });

                const completionRate = totalSentences > 0 
                    ? ((annotatedSentences / totalSentences) * 100).toFixed(1)
                    : 0;

                // 更新统计卡片
                document.getElementById('totalVideos').textContent = totalVideos;
                document.getElementById('totalSentences').textContent = totalSentences;
                document.getElementById('annotatedSentences').textContent = annotatedSentences;
                document.getElementById('completionRate').textContent = completionRate + '%';
                document.getElementById('statsGrid').style.display = 'grid';

                // 渲染表格
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                videos.forEach(video => {
                    const total = video.total_sentences || 0;
                    const annotated = video.annotated_sentences || 0;
                    const percentage = total > 0 ? ((annotated / total) * 100).toFixed(1) : 0;
                    
                    let statusClass = 'status-pending';
                    let statusText = '未完成';
                    
                    if (video.status === 'submitted') {
                        statusClass = 'status-submitted';
                        statusText = '已提交';
                    } else if (video.status === 'completed') {
                        statusClass = 'status-completed';
                        statusText = '已完成';
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${video.name}</strong></td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${total} 句</td>
                        <td>${annotated} 句</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percentage}%"></div>
                            </div>
                        </td>
                        <td><strong>${percentage}%</strong></td>
                    `;
                    tbody.appendChild(row);
                });

                document.getElementById('dataContainer').style.display = 'block';

            } catch (error) {
                console.error('查询失败:', error);
                document.getElementById('loadingDiv').style.display = 'none';
                alert('查询失败: ' + error.message);
            }
        }

        // 页面加载时自动查询
        window.onload = () => {
            loadAnnotatorData();
        };

        // 按回车键也可以查询
        document.getElementById('annotatorInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadAnnotatorData();
            }
        });
    </script>
</body>
</html>
