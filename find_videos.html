<!DOCTYPE html>
<html>
<head>
  <title>查找视频</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    pre { background: #f5f5f5; padding: 10px; }
    .found { color: green; }
    .notfound { color: red; }
  </style>
</head>
<body>
  <h2>查找这7个视频</h2>
  <button onclick="findVideos()">开始查找</button>
  <div id="result"></div>
  
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    const supabaseUrl = 'https://dcqwxvekgxgjujurpipg.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjcXd4dmVrZ3hnanVqdXJwaXBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwODYzODAsImV4cCI6MjA3ODY2MjM4MH0.AW8O6XG3Zj75B1eqfpCNNLACfdKYhcQhYYWzVPuTPAw'
    
    const supabase = createClient(supabaseUrl, supabaseKey)
    
    const targetVideos = [
      '1104-语文-1.mp4',
      '1104-英语-1.mp4',
      '1104-英语-2.mp4',
      '1104-数学-2.mp4',
      '1104-数学-1.mp4',
      '1104-物理-2.mp4',
      '1104-物理-1.mp4'
    ]
    
    window.findVideos = async function() {
      const resultEl = document.getElementById('result')
      resultEl.innerHTML = '<p>正在查询...</p>'
      
      try {
        // 查询所有视频
        const { data: allVideos, error } = await supabase
          .from('videos')
          .select('*')
          .order('name')
        
        if (error) {
          resultEl.innerHTML = `<p class="notfound">错误: ${JSON.stringify(error)}</p>`
          return
        }
        
        let html = '<h3>查询结果：</h3>'
        html += '<table border="1" style="border-collapse: collapse; width: 100%;">'
        html += '<tr><th>目标视频</th><th>状态</th><th>数据库中的ID</th><th>数据库中的名称</th></tr>'
        
        targetVideos.forEach(targetName => {
          const found = allVideos.find(v => v.name === targetName)
          
          if (found) {
            html += '<tr class="found">'
            html += `<td>${targetName}</td>`
            html += `<td>✅ 找到</td>`
            html += `<td>${found.id}</td>`
            html += `<td>${found.name}</td>`
            html += '</tr>'
          } else {
            html += '<tr class="notfound">'
            html += `<td>${targetName}</td>`
            html += `<td>❌ 未找到</td>`
            html += `<td colspan="2">-</td>`
            html += '</tr>'
          }
        })
        
        html += '</table>'
        
        html += '<h3 style="margin-top: 30px;">数据库中所有视频（共 ' + allVideos.length + ' 个）：</h3>'
        html += '<ol>'
        allVideos.forEach(v => {
          html += `<li>${v.name} (ID: ${v.id.substring(0, 25)}...)</li>`
        })
        html += '</ol>'
        
        resultEl.innerHTML = html
        
      } catch (err) {
        resultEl.innerHTML = `<p class="notfound">异常: ${err.message}</p>`
      }
    }
  </script>
</body>
</html>
