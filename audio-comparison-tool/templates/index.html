<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频对比工具 - 读音问题检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .upload-box:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }

        .upload-box.has-file {
            border-color: #48bb78;
            background: #f0fff4;
        }

        .upload-box h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .upload-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .file-info {
            margin-top: 15px;
            color: #666;
            font-size: 0.9rem;
        }

        .settings {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .settings h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .settings select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .compare-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        .compare-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .compare-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
        }

        .result.active {
            display: block;
        }

        .result-header {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .result-header h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .similarity-score {
            font-size: 3rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .transcript-box {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .transcript-box h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .transcript-box p {
            color: #333;
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .issues-section {
            margin: 20px 0;
        }

        .issue-item {
            background: #fff5f5;
            border-left: 4px solid #fc8181;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .issue-item.medium {
            background: #fffaf0;
            border-left-color: #f6ad55;
        }

        .visualization {
            margin-top: 30px;
            text-align: center;
        }

        .visualization img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .error {
            background: #fff5f5;
            color: #c53030;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #fc8181;
            display: none;
        }

        .error.active {
            display: block;
        }

        @media (max-width: 768px) {
            .upload-section {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 音频对比工具</h1>
            <p>AI驱动的读音问题检测系统</p>
        </div>

        <div class="content">
            <div class="upload-section">
                <div class="upload-box" id="refBox">
                    <h3>📌 标准音频</h3>
                    <label for="refFile" class="upload-btn">选择文件</label>
                    <input type="file" id="refFile" accept="audio/*">
                    <div class="file-info" id="refInfo">未选择文件</div>
                </div>

                <div class="upload-box" id="tgtBox">
                    <h3>🎤 待检测音频</h3>
                    <label for="tgtFile" class="upload-btn">选择文件</label>
                    <input type="file" id="tgtFile" accept="audio/*">
                    <div class="file-info" id="tgtInfo">未选择文件</div>
                </div>
            </div>

            <div class="settings">
                <h3>⚙️ 模型设置</h3>
                <select id="modelSelect">
                    <option value="tiny">Tiny - 快速 (39MB)</option>
                    <option value="base" selected>Base - 平衡 (74MB) 推荐</option>
                    <option value="small">Small - 准确 (244MB)</option>
                    <option value="medium">Medium - 高准确 (769MB)</option>
                    <option value="large">Large - 最高准确 (1550MB)</option>
                </select>
            </div>

            <button class="compare-btn" id="compareBtn" disabled>
                🚀 开始对比分析
            </button>

            <div class="error" id="error"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在分析音频，请稍候...</p>
                <p style="color: #666; margin-top: 10px;">这可能需要几分钟时间</p>
            </div>

            <div class="result" id="result">
                <div class="result-header">
                    <h2>📊 分析结果</h2>
                    <div class="similarity-score" id="similarityScore">--</div>
                    <p id="assessment">--</p>
                </div>

                <div class="transcript-box">
                    <h4>📝 标准文本</h4>
                    <p id="refText">--</p>
                </div>

                <div class="transcript-box">
                    <h4>📝 检测文本</h4>
                    <p id="tgtText">--</p>
                </div>

                <div class="issues-section" id="issuesSection">
                    <h3>⚠️ 检测到的问题</h3>
                    <div id="issuesList"></div>
                </div>

                <div class="visualization">
                    <h3>📈 可视化分析</h3>
                    <img id="vizImage" src="" alt="音频对比可视化">
                </div>
            </div>
        </div>
    </div>

    <script>
        const refFile = document.getElementById('refFile');
        const tgtFile = document.getElementById('tgtFile');
        const refBox = document.getElementById('refBox');
        const tgtBox = document.getElementById('tgtBox');
        const refInfo = document.getElementById('refInfo');
        const tgtInfo = document.getElementById('tgtInfo');
        const compareBtn = document.getElementById('compareBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');

        refFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                refInfo.textContent = `✅ ${e.target.files[0].name}`;
                refBox.classList.add('has-file');
                checkFiles();
            }
        });

        tgtFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                tgtInfo.textContent = `✅ ${e.target.files[0].name}`;
                tgtBox.classList.add('has-file');
                checkFiles();
            }
        });

        function checkFiles() {
            compareBtn.disabled = !(refFile.files.length > 0 && tgtFile.files.length > 0);
        }

        compareBtn.addEventListener('click', async () => {
            const formData = new FormData();
            formData.append('reference', refFile.files[0]);
            formData.append('target', tgtFile.files[0]);
            formData.append('model', document.getElementById('modelSelect').value);

            loading.classList.add('active');
            result.classList.remove('active');
            error.classList.remove('active');
            compareBtn.disabled = true;

            try {
                const response = await fetch('/api/compare', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    displayResult(data);
                } else {
                    showError(data.error || '分析失败');
                }
            } catch (err) {
                showError('网络错误: ' + err.message);
            } finally {
                loading.classList.remove('active');
                compareBtn.disabled = false;
            }
        });

        function displayResult(data) {
            document.getElementById('similarityScore').textContent = 
                `${data.overall_similarity.toFixed(1)} / 100`;
            document.getElementById('assessment').textContent = data.assessment;
            document.getElementById('refText').textContent = data.reference_text;
            document.getElementById('tgtText').textContent = data.target_text;

            const issuesList = document.getElementById('issuesList');
            if (data.issues && data.issues.length > 0) {
                issuesList.innerHTML = data.issues.map(issue => `
                    <div class="issue-item ${issue.severity}">
                        <strong>⏱ ${issue.start_time.toFixed(2)}s - ${issue.end_time.toFixed(2)}s</strong><br>
                        相似度: ${issue.similarity.toFixed(1)} | 严重程度: ${issue.severity === 'high' ? '高' : '中'}
                    </div>
                `).join('');
            } else {
                issuesList.innerHTML = '<p style="color: #48bb78;">✅ 未检测到明显问题</p>';
            }

            if (data.visualization) {
                document.getElementById('vizImage').src = data.visualization;
            }

            result.classList.add('active');
        }

        function showError(message) {
            error.textContent = '❌ ' + message;
            error.classList.add('active');
        }
    </script>
</body>
</html>
