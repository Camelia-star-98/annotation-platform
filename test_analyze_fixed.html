<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试返工分析（已修复）</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .version {
            color: #22c55e;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .success {
            color: #22c55e;
            padding: 15px;
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .error {
            color: #ef4444;
            padding: 15px;
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            border-radius: 5px;
        }

        .video-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .video-info div {
            margin: 8px 0;
            padding: 5px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .video-info div:last-child {
            border-bottom: none;
        }

        .label {
            display: inline-block;
            width: 100px;
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 测试返工分析工具（已修复版）</h1>
        <div class="version">✅ 已修复 filename → name 字段问题</div>

        <div class="input-group">
            <label for="videoName">输入视频名称（支持模糊搜索）：</label>
            <input type="text" id="videoName" placeholder="例如：第5批第一轮-语文-1" value="第5批第一轮-语文-1">
        </div>

        <button class="btn" onclick="testAnalyze()">🔍 测试查询</button>

        <div id="results" class="results" style="display: none;"></div>
    </div>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://mcncrrkeqsmjckpgimtb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jbmNycmtlcXNtamNrcGdpbXRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzU1Mzk5NzUsImV4cCI6MjA1MTExNTk3NX0.1SIB0UXTMDmALr5kXqcZZYKk7G-0hHdh8Bq4P_Y_Y4w';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testAnalyze() {
            const videoName = document.getElementById('videoName').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!videoName) {
                alert('请输入视频名称！');
                return;
            }

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = '<div class="loading">⏳ 正在查询...</div>';

            try {
                console.log('🔍 Step 1: 查询视频，使用字段 name，模糊匹配：', videoName);
                
                // ✅ 修复后的查询：使用 name 字段，支持模糊搜索
                const { data: videos, error: videoError } = await supabase
                    .from('videos')
                    .select('*')
                    .ilike('name', `%${videoName}%`);

                console.log('📦 查询结果:', { videos, error: videoError });

                if (videoError) {
                    throw new Error(`数据库错误: ${videoError.message}`);
                }

                if (!videos || videos.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="error">
                            ❌ 未找到匹配的视频<br>
                            搜索条件：name ILIKE '%${videoName}%'
                        </div>
                    `;
                    return;
                }

                const video = videos[0];
                
                console.log('✅ 找到视频:', video);

                // Step 2: 查询标注数据
                console.log('🔍 Step 2: 查询标注数据...');
                const { data: annotations, error: annotationError } = await supabase
                    .from('annotations')
                    .select('*')
                    .eq('video_id', video.id);

                console.log('📦 标注数据:', { count: annotations?.length, error: annotationError });

                if (annotationError) {
                    throw new Error(`查询标注数据失败: ${annotationError.message}`);
                }

                // 显示结果
                resultsDiv.innerHTML = `
                    <div class="success">
                        ✅ 查询成功！找到 ${videos.length} 个匹配的视频
                    </div>
                    <div class="video-info">
                        <div><span class="label">视频名称：</span>${video.name}</div>
                        <div><span class="label">视频ID：</span>${video.id}</div>
                        <div><span class="label">科目：</span>${video.subject || '未设置'}</div>
                        <div><span class="label">时长：</span>${video.duration || 0} 秒</div>
                        <div><span class="label">上传时间：</span>${video.created_at ? new Date(video.created_at).toLocaleString('zh-CN') : '未知'}</div>
                        <div><span class="label">标注数量：</span>${annotations?.length || 0} 条</div>
                    </div>
                    ${videos.length > 1 ? `
                        <div style="margin-top: 15px; padding: 10px; background: #fef3c7; border-radius: 5px; color: #92400e;">
                            ⚠️ 提示：找到 ${videos.length} 个匹配的视频，当前显示第一个
                        </div>
                    ` : ''}
                `;

            } catch (error) {
                console.error('❌ 错误:', error);
                resultsDiv.innerHTML = `
                    <div class="error">
                        ❌ 查询失败<br>
                        错误信息：${error.message}<br>
                        <br>
                        <strong>请检查：</strong><br>
                        1. Supabase 连接是否正常<br>
                        2. videos 表是否存在 name 字段<br>
                        3. 浏览器控制台查看详细错误
                    </div>
                `;
            }
        }

        // 页面加载时测试连接
        window.addEventListener('load', async () => {
            console.log('🚀 页面加载完成，测试 Supabase 连接...');
            try {
                const { data, error } = await supabase
                    .from('videos')
                    .select('count')
                    .limit(1);
                
                if (error) {
                    console.error('❌ Supabase 连接失败:', error);
                } else {
                    console.log('✅ Supabase 连接成功');
                }
            } catch (err) {
                console.error('❌ 连接测试失败:', err);
            }
        });
    </script>
</body>
</html>
