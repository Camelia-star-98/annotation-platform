<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>检查 Supabase Storage 配置</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #1890ff; }
    h2 { color: #333; border-bottom: 2px solid #1890ff; padding-bottom: 10px; }
    button {
      background: #1890ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    button:hover { background: #40a9ff; }
    .success { color: #52c41a; font-weight: bold; }
    .error { color: #ff4d4f; font-weight: bold; }
    .warning { color: #faad14; font-weight: bold; }
    .info { color: #1890ff; }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      border-left: 4px solid #1890ff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #d9d9d9;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #fafafa;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🔍 检查 Supabase Storage 配置</h1>
  
  <div class="container">
    <h2>问题诊断</h2>
    <p>如果视频上传失败并提示"上传返回空URL"，可能是以下原因：</p>
    <ul>
      <li>Storage bucket 'videos' 不存在</li>
      <li>Storage bucket 没有设置为公开</li>
      <li>权限配置问题</li>
      <li>文件路径生成失败</li>
    </ul>
    <button onclick="checkStorage()">🔍 开始检查</button>
    <div id="result"></div>
  </div>

  <div class="container" id="testContainer" style="display:none;">
    <h2>测试上传</h2>
    <p>选择一个小的测试文件（< 10MB）来测试上传功能：</p>
    <input type="file" id="testFile" accept="video/*" />
    <button onclick="testUpload()">📤 测试上传</button>
    <div id="testResult"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dcqwxvekgxgjujurpipg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjcXd4dmVrZ3hnanVqdXJwaXBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwODYzODAsImV4cCI6MjA3ODY2MjM4MH0.AW8O6XG3Zj75B1eqfpCNNLACfdKYhcQhYYWzVPuTPAw';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkStorage() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p class="info">正在检查...</p>';

      try {
        // 1. 检查 Storage bucket 列表
        const { data: buckets, error: bucketsError } = await supabase.storage.listBuckets();
        
        if (bucketsError) {
          throw bucketsError;
        }

        console.log('📦 Storage buckets:', buckets);

        // 2. 检查 'videos' bucket 是否存在
        const videosBucket = buckets.find(b => b.name === 'videos');
        
        let html = '<div style="margin-top: 20px;">';
        html += '<h3>📦 Storage Buckets 检查</h3>';
        html += '<pre>';
        
        if (buckets.length === 0) {
          html += '<span class="error">❌ 没有找到任何 Storage bucket</span>\n';
          html += '请在 Supabase 控制台创建 "videos" bucket\n';
        } else {
          html += `✅ 找到 ${buckets.length} 个 bucket:\n`;
          buckets.forEach(bucket => {
            html += `  - ${bucket.name} (${bucket.public ? '公开' : '私有'})\n`;
          });
          html += '\n';
          
          if (!videosBucket) {
            html += '<span class="error">❌ 没有找到 "videos" bucket</span>\n';
            html += '请按照以下步骤创建：\n';
            html += '1. 访问 Supabase 控制台\n';
            html += '2. 进入 Storage 页面\n';
            html += '3. 创建新 bucket，名称为 "videos"\n';
            html += '4. 设置为公开（Public）\n';
          } else {
            html += '<span class="success">✅ 找到 "videos" bucket</span>\n';
            html += `   - 名称: ${videosBucket.name}\n`;
            html += `   - 公开: ${videosBucket.public ? '<span class="success">是</span>' : '<span class="error">否（需要设置为公开）</span>'}\n`;
            html += `   - 创建时间: ${videosBucket.created_at}\n`;
            
            if (!videosBucket.public) {
              html += '\n<span class="warning">⚠️ 警告：bucket 不是公开的，这可能导致无法获取公开URL</span>\n';
              html += '请按照以下步骤修改：\n';
              html += '1. 访问 Supabase 控制台\n';
              html += '2. 进入 Storage > videos bucket\n';
              html += '3. 在 Settings 中将 bucket 设置为 Public\n';
            }
          }
        }
        
        html += '</pre>';
        html += '</div>';

        // 3. 如果 videos bucket 存在，检查文件列表
        if (videosBucket) {
          html += '<div style="margin-top: 20px;">';
          html += '<h3>📁 videos bucket 中的文件</h3>';
          
          const { data: files, error: filesError } = await supabase.storage
            .from('videos')
            .list('', {
              limit: 10,
              sortBy: { column: 'created_at', order: 'desc' }
            });
          
          if (filesError) {
            html += `<p class="error">❌ 无法列出文件: ${filesError.message}</p>`;
            html += '<p>这可能表示权限问题</p>';
          } else {
            html += `<pre>找到 ${files.length} 个文件（最近10个）：\n`;
            if (files.length === 0) {
              html += '  （暂无文件）\n';
            } else {
              files.forEach(file => {
                const fileSize = file.metadata && file.metadata.size ? (file.metadata.size / 1024 / 1024).toFixed(2) : '未知';
                html += `  - ${file.name} (${fileSize}MB)\n`;
              });
            }
            html += '</pre>';
          }
          
          html += '</div>';
        }

        resultDiv.innerHTML = html;

        // 显示测试上传区域
        if (videosBucket && videosBucket.public) {
          document.getElementById('testContainer').style.display = 'block';
        }

      } catch (error) {
        console.error('检查失败:', error);
        resultDiv.innerHTML = `<p class="error">检查失败: ${error.message}</p>`;
        resultDiv.innerHTML += '<pre>' + JSON.stringify(error, null, 2) + '</pre>';
      }
    }

    async function testUpload() {
      const fileInput = document.getElementById('testFile');
      if (!fileInput) {
        alert('找不到文件输入框');
        return;
      }
      const file = fileInput.files && fileInput.files[0];
      
      if (!file) {
        alert('请先选择一个文件');
        return;
      }

      const resultDiv = document.getElementById('testResult');
      resultDiv.innerHTML = '<p class="info">正在上传测试文件...</p>';

      try {
        const timestamp = Date.now();
        const fileExt = file.name.split('.').pop() || 'mp4';
        const fileName = `test_${timestamp}.${fileExt}`;
        
        console.log('📤 开始上传测试文件:', fileName);
        
        // 上传文件
        const { data, error } = await supabase.storage
          .from('videos')
          .upload(fileName, file, {
            cacheControl: '3600',
            upsert: false
          });

        if (error) {
          throw error;
        }

        console.log('✅ 上传成功:', data);

        // 获取公开URL
        const { data: urlData } = supabase.storage
          .from('videos')
          .getPublicUrl(data.path);

        console.log('📝 URL数据:', urlData);

        if (!urlData || !urlData.publicUrl) {
          throw new Error('无法获取公开URL');
        }

        let html = '<div style="margin-top: 20px; padding: 20px; background: #f6ffed; border-left: 4px solid #52c41a;">';
        html += '<p class="success">✅ 测试上传成功！</p>';
        html += '<pre>';
        html += `文件名: ${fileName}\n`;
        html += `路径: ${data.path}\n`;
        html += `公开URL: ${urlData.publicUrl}\n`;
        html += '</pre>';
        html += '<p><strong>✅ Storage 配置正常，可以正常上传和获取URL</strong></p>';
        html += '</div>';

        resultDiv.innerHTML = html;

      } catch (error) {
        console.error('测试上传失败:', error);
        let html = '<div style="margin-top: 20px; padding: 20px; background: #fff2e8; border-left: 4px solid #faad14;">';
        html += '<p class="error">❌ 测试上传失败</p>';
        html += '<pre>';
        html += `错误: ${error.message}\n`;
        html += `详情: ${JSON.stringify(error, null, 2)}\n`;
        html += '</pre>';
        html += '</div>';
        resultDiv.innerHTML = html;
      }
    }

    // 自动运行检查
    window.onload = function() {
      setTimeout(() => {
        checkStorage();
      }, 500);
    };
  </script>
</body>
</html>
